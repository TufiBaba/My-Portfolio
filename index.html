<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burak - Portfolio</title>
    <style>
        /* Genel Tasarım - Karanlık Tema */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        /* Üst Başlık Kısmı */
        header {
            text-align: center;
            padding: 80px 20px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }

        h1 {
            color: #58a6ff;
            font-size: 3rem;
            margin-bottom: 10px;
            margin-top: 0;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #8b949e;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Portfolyo Izgarası */
        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

            .container h2 {
                text-align: center;
                font-size: 2rem;
                margin-bottom: 40px;
                color: #fff;
            }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Kart Tasarımları */
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

            .card:hover {
                transform: translateY(-8px);
                border-color: #58a6ff;
            }

            .card img {
                width: 100%;
                height: 280px;
                object-fit: cover;
                background: #21262d;
                border-bottom: 1px solid #30363d;
                cursor: pointer; /* Fare imlecini el işaretine çevirir */
                transition: opacity 0.3s;
            }

                .card img:hover {
                    opacity: 0.8;
                }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card h3 {
            margin: 0;
            color: #fff;
            font-size: 1.4rem;
        }

        /* Alt Bilgi (Footer) */
        footer {
            text-align: center;
            padding: 50px 20px;
            margin-top: 60px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }

        .contact-email {
            color: #58a6ff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
        }

            .contact-email:hover {
                text-decoration: underline;
            }

        /* Büyütülen Resim (Modal) Tasarımı */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85); /* Yarı saydam siyah arkaplan */
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90vh;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            object-fit: contain; /* Resmin tamamının sığmasını sağlar */
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

            .close:hover {
                color: #58a6ff;
            }
    </style>
</head>
<body>

    <header>
        <h1>Merhaba, Ben Burak</h1>
        <p class="subtitle">Gelişmekte Olan Bağımsız Geliştirici</p>
    </header>

    <div class="container">
        <h2>Featured Works</h2>
        <div class="grid">

            <!-- 1. Proje -->
            <div class="card">
                <img src="Axe.png" alt="Axe Model" class="zoom-img">
                <div class="card-content">
                    <h3>Axe</h3>
                </div>
            </div>

            <!-- 2. Proje -->
            <div class="card">
                <img src="Dango.png" alt="Dango Model" class="zoom-img">
                <div class="card-content">
                    <h3>Dango</h3>
                </div>
            </div>

            <!-- 3. Proje -->
            <div class="card">
                <img src="Hammer.png" alt="Hammer Model" class="zoom-img">
                <div class="card-content">
                    <h3>Hammer</h3>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <h2 style="color: #fff; margin-bottom: 20px;">Contact me</h2>
        <a href="mailto:buraktufan002@gmail.com" class="contact-email">buraktufan002@gmail.com</a>
    </footer>

    <!-- Resmi Büyütmek İçin Gizli Modal Penceresi -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <!-- Tıklama İşlemleri İçin Javascript -->
    <script>
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("expandedImg");
        const images = document.querySelectorAll(".zoom-img");
        const span = document.getElementsByClassName("close")[0];

        // Resimlere tıklanınca modali aç ve resmi aktar
        images.forEach(img => {
            img.onclick = function(){
                modal.style.display = "block";
                modalImg.src = this.src;
            }
        });

        // Çarpı ikonuna basınca kapat
        span.onclick = function() {
            modal.style.display = "none";
        }

        // Resmin dışındaki karanlık alana tıklayınca kapat
        modal.onclick = function(e) {
            if(e.target !== modalImg) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
